name: SFTP diagnostics (temporary files only)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sftp_diagnostics.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - run: pip install paramiko
    - name: Read manifests and verify an isolated temporary upload
      env:
        SFTP_HOST: ${{ secrets.SFTP_HOST }}
        SFTP_USER: ${{ secrets.SFTP_USERNAME }}
        SFTP_PASS: ${{ secrets.SFTP_PASSWORD }}
        SFTP_PORT: ${{ secrets.SFTP_PORT || 22 }}
        TARGET_DIR: ${{ vars.SFTP_TARGET_DIR }}
      run: |
        python -u - <<'PY'
        import hashlib
        import os
        import socket
        import subprocess
        import tempfile
        import time
        import uuid
        from pathlib import Path
        import paramiko
        from deploy_common import read_settings, remote_path
        from deploy_sftp import _upload_with_replace, deploy
        import deploy_sftp

        settings = read_settings(allow_root=True)
        def connect(profile):
            sock = socket.create_connection((settings.host, settings.port), timeout=15)
            transport = paramiko.Transport(sock)
            transport.set_keepalive(15)
            if profile == 'current':
                transport.default_window_size = 8192
                transport.default_max_packet_size = 1024
            transport.connect(username=settings.user, password=settings.password)
            sftp = paramiko.SFTPClient.from_transport(transport)
            sftp.get_channel().settimeout(10)
            return transport, sftp

        def run_probe(profile):
            original_upload = deploy_sftp._upload
            if profile == 'small-writes':
                def upload(sftp, local, remote):
                    with local.open('rb') as source, sftp.open(remote, 'wb') as destination:
                        while chunk := source.read(1024):
                            destination.write(chunk)
                deploy_sftp._upload = upload
            try:
                probe_profile(profile)
            except Exception as error:
                print('PROFILE FAILED:', profile, type(error).__name__, str(error), flush=True)
                return False
            finally:
                deploy_sftp._upload = original_upload
            return True

        def probe_profile(profile):
            print('Starting profile:', profile, flush=True)
            transport, sftp = connect(profile)
            probe = remote_path(settings.target, '.sftp-probe-' + uuid.uuid4().hex)
            try:
                print('Profile:', profile, 'Paramiko:', paramiko.__version__, flush=True)
                for name in ('deploy_server_manifest.json', 'deploy_client_manifest.json'):
                    started = time.monotonic()
                    with sftp.open(remote_path(settings.target, name), 'rb') as source:
                        data = source.read()
                    print('Read', name, len(data), 'bytes in', round(time.monotonic() - started, 2), 'seconds')
                # Use the same JSON payload that failed in the deployment.
                with sftp.open(remote_path(settings.target, 'deploy_server_manifest.json'), 'rb') as source:
                    payload = source.read()
                with tempfile.TemporaryDirectory() as directory:
                    local = Path(directory) / 'probe.bin'
                    local.write_bytes(payload)
                    for iteration in range(2):
                        started = time.monotonic()
                        print('Uploading isolated probe', iteration + 1, flush=True)
                        _upload_with_replace(sftp, local, probe)
                        with sftp.open(probe, 'rb') as source:
                            actual = source.read()
                        assert hashlib.sha256(actual).digest() == hashlib.sha256(payload).digest()
                        print('Upload, replacement and readback OK:', round(time.monotonic() - started, 2), 'seconds')
            finally:
                transport.close()
                cleanup_transport, cleanup = connect('defaults')
                try:
                    prefix = Path(probe).name
                    for name in cleanup.listdir(settings.target):
                        if name == prefix or name.startswith(prefix + '.tmp-') or name.startswith(prefix + '.bak-'):
                            cleanup.remove(remote_path(settings.target, name))
                            print('Removed this run\'s probe:', name)
                finally:
                    cleanup_transport.close()

        # Exercise the real smart deployment with writes physically unavailable.
        # A changed build fails this check before any remote mutation.
        subprocess.run(['python', 'build_pack.py'], check=True)
        transport, sftp = connect('current')
        class ReadOnlySftp:
            def open(self, path, mode):
                if mode != 'rb':
                    raise RuntimeError('Read-only deployment check refused a write')
                return sftp.open(path, mode)

            def stat(self, path):
                return sftp.stat(path)

        try:
            deploy(ReadOnlySftp(), settings.target)
            print('Unchanged smart deployment passed with all remote mutations blocked', flush=True)
        finally:
            transport.close()

        outcomes = {profile: run_probe(profile) for profile in ('current', 'defaults', 'small-writes')}
        print('PROFILE RESULTS:', outcomes, flush=True)
        raise SystemExit(0 if all(outcomes.values()) else 1)
        PY
