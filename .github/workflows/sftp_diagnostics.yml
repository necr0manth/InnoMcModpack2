name: SFTP diagnostics (temporary files only)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sftp_diagnostics.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - run: python -m pip install -r requirements-build.txt paramiko
    - name: Read manifests and verify an isolated temporary upload
      env:
        SFTP_HOST: ${{ secrets.SFTP_HOST }}
        SFTP_USER: ${{ secrets.SFTP_USERNAME }}
        SFTP_PASS: ${{ secrets.SFTP_PASSWORD }}
        SFTP_PORT: ${{ secrets.SFTP_PORT || 22 }}
        TARGET_DIR: ${{ vars.SFTP_TARGET_DIR }}
      run: |
        python -u - <<'PY'
        import hashlib
        import os
        import socket
        import tempfile
        import time
        import uuid
        from functools import partial
        from pathlib import Path
        from unittest.mock import patch

        import paramiko
        from deploy_common import read_settings, remote_path
        from deploy_sftp import _upload, _upload_with_replace

        settings = read_settings(allow_root=True)
        payload = os.urandom(2 * 1024 * 1024)
        expected = hashlib.sha256(payload).digest()

        def connect(defaults=False):
            sock = socket.create_connection((settings.host, settings.port), timeout=15)
            transport = paramiko.Transport(sock)
            try:
                transport.set_keepalive(15)
                if not defaults:
                    transport.default_window_size = 8192
                    transport.default_max_packet_size = 1024
                transport.connect(username=settings.user, password=settings.password)
                sftp = paramiko.SFTPClient.from_transport(transport)
                sftp.get_channel().settimeout(10)
                return transport, sftp
            except Exception:
                transport.close()
                raise

        def read_manifests():
            transport, sftp = connect()
            try:
                for name in ('deploy_server_manifest.json', 'deploy_client_manifest.json'):
                    started = time.monotonic()
                    try:
                        with sftp.open(remote_path(settings.target, name), 'rb') as source:
                            data = source.read()
                    except FileNotFoundError:
                        print('No deployed manifest:', name, flush=True)
                    else:
                        print('Read', name, len(data), 'bytes in',
                              round(time.monotonic() - started, 2), 'seconds', flush=True)
            finally:
                transport.close()

        def probe_profile(profile, local, *, defaults=False, pipelined=True):
            print('Starting profile:', profile, flush=True)
            probe = remote_path(settings.target, '.sftp-probe-' + uuid.uuid4().hex)
            transport, sftp = connect(defaults)
            try:
                with patch('deploy_sftp._upload', partial(_upload, pipelined=pipelined)):
                    for iteration in (1, 2):
                        started = time.monotonic()
                        _upload_with_replace(sftp, local, probe)
                        seconds = time.monotonic() - started
                        with sftp.open(probe, 'rb') as source:
                            source.prefetch(len(payload), max_concurrent_requests=64)
                            actual = source.read()
                        if hashlib.sha256(actual).digest() != expected:
                            raise OSError('Probe readback checksum mismatch')
                        print(profile, 'attempt', iteration, 'upload + replacement:',
                              round(seconds, 2), 'seconds, SHA-256 OK', flush=True)
            finally:
                transport.close()
                cleanup_transport, cleanup = connect(defaults=True)
                try:
                    prefix = Path(probe).name
                    for name in cleanup.listdir(settings.target):
                        if name == prefix or name.startswith(prefix + '.tmp-') or name.startswith(prefix + '.bak-'):
                            cleanup.remove(remote_path(settings.target, name))
                finally:
                    cleanup_transport.close()

        manifests_readable = True
        try:
            read_manifests()
        except Exception as error:
            manifests_readable = False
            print('Manifest read failed:', type(error).__name__, str(error), flush=True)

        outcomes = {}
        with tempfile.TemporaryDirectory() as directory:
            local = Path(directory) / 'probe.bin'
            local.write_bytes(payload)
            for profile, options in (
                ('pipelined', {}),
                ('serial', {'pipelined': False}),
                ('pipelined-default-channel', {'defaults': True}),
            ):
                try:
                    probe_profile(profile, local, **options)
                except Exception as error:
                    print('PROFILE FAILED:', profile, type(error).__name__, str(error), flush=True)
                    outcomes[profile] = False
                else:
                    outcomes[profile] = True
        print('PROFILE RESULTS:', outcomes, flush=True)
        raise SystemExit(0 if manifests_readable and all(outcomes.values()) else 1)
        PY
