enableEffects = true

[trigger]
	avoidDuplicates = true
	# Default: 5.0
	# Range: 0.0 ~ 1.7976931348623157E308
	avoidDuplicatesRange = 5.0
	# Default: 6.0
	# Range: 0.0 ~ 1.7976931348623157E308
	minBPS = 6.0
	# Default: 7000.0
	# Range: 0.0 ~ 1.7976931348623157E308
	minForce = 7000.0

	[effects.ParticleExplosionEmitter]
		enableParticleExplosionEmitterEffect = true
		# Default: 3
		# Range: > 1
		amountParticleExplosionEmitterEffect = 3
		# Default: 1.0
		# Range: 0.0 ~ 1.7976931348623157E308
		rangeParticleExplosionEmitterEffect = 1.0
		# Default: 0.7
		# Range: 0.0 ~ 1.7976931348623157E308
		speedParticleExplosionEmitterEffect = 0.7

	[effects.ParticleWhiteSmoke]
		enableParticleWhiteSmokeEffect = true
		# Default: 3
		# Range: > 1
		amountParticleWhiteSmokeEffect = 3
		# Default: 1.0
		# Range: 0.0 ~ 1.7976931348623157E308
		rangeParticleWhiteSmokeEffect = 1.0
		# Default: 1.0E-4
		# Range: 0.0 ~ 1.7976931348623157E308
		speedParticleWhiteSmokeEffect = 1.0E-4

	[effects.ParticleBigCannonPlume]
		enableParticleBigCannonPlumeEffect = true
		# Default: 1
		# Range: > 1
		amountParticleBigCannonPlumeEffect = 1
		# Default: 1.0
		# Range: 0.0 ~ 1.7976931348623157E308
		rangeParticleBigCannonPlumeEffect = 1.0
		# Default: 1.0E-5
		# Range: 0.0 ~ 1.7976931348623157E308
		speedParticleBigCannonPlumeEffect = 1.0E-5

	[effects.SoundExplosion]
		enableSoundExplosionEffect = true

	[effects.Debug]
		enableDebugEffect = false
