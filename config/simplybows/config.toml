# Simply Bows 0.1.4 (MC 1.21.1, NeoForge) — настройки лута, версия 2
# Положить в: <папка инстанса>/config/simplybows/config.toml
# (заменить существующий файл целиком; если мод уже создавал свой — перезаписать)
#
# ШКАЛА ШАНСОВ: значение X = шанс X/1000 на срабатывание в КАЖДОМ сундуке.
#
# ВАЖНО: этот мод инжектит лут ТОЛЬКО в ванильные сундуки (minecraft:chests/*).
# Уникальные луки теперь спавнятся в данжах Dungeon Crawl (0.5% на сундук,
# рандомно один из 7) — это настроено пакетом v2.5 в kubejs/data, НЕ в этом файле.
#
# Уникальных луков 7 (Starweave/cosmic в луте не выпадает вообще):
#   Everbloom (vine), Winterfang (ice), Bubbleveil (bubble), Buzzkill (bee),
#   Petalwind (blossom), Tremorstrike (earth), Echo
# Рецептов у мода нет — лут единственный играбельный источник.

[loot]
    # <глобальные шансы — любой ванильный сундук>
    # ЛУК: 0.0 = луки УБРАНЫ из ванильных сундуков полностью
    # (дефолт мода 2.0 = 0.2%; в v1 конфига было 10.0 = 1%)
    baseUniqueBowChance = 0.0
    # материалы апгрейдов (тетива/рамка/руны) — оставлены как было:
    baseStringChance = 20.0
    baseFrameChance = 20.0
    baseRuneChance = 3.0

    # <тематические сундуки — ДОП. шанс сверху>
    # тематический лук: 0.0 = убран (дефолт 15.0 = 1.5%)
    boostedBowChance = 0.0
    # руны в Ancient City (не трогали):
    boostedRuneChanceAncientCity = 20.0
